<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#8e2d2d">
  <title>Refresh Dinner Recipe Book</title>
  <style>
    body{font-family:system-ui,-apple-system,sans-serif;margin:0;background:#fbf7f2;color:#2d2926;display:grid;min-height:100vh;place-items:center;padding:24px;box-sizing:border-box}
    main{max-width:520px;background:white;border:1px solid #ddd3c9;border-radius:22px;padding:28px;box-shadow:0 8px 28px rgba(0,0,0,.08)}
    h1{margin-top:0}.status{font-size:1.08rem;line-height:1.5}.small{color:#716a64;font-size:.92rem}
    button{border:0;border-radius:14px;padding:14px 18px;background:#982f31;color:white;font-weight:700;font-size:1rem}
  </style>
</head>
<body>
<main>
  <h1>Refreshing recipe app</h1>
  <p id="status" class="status">Removing the old offline cache…</p>
  <p class="small">Favorites, ratings, notes, shopping selections and downloaded recipe data are kept. Only the outdated app files are removed.</p>
  <button id="retry" hidden>Try again</button>
</main>
<script>
(async () => {
  const status = document.getElementById('status');
  const retry = document.getElementById('retry');
  try {
    if ('serviceWorker' in navigator) {
      const registrations = await navigator.serviceWorker.getRegistrations();
      await Promise.all(registrations.map(registration => registration.unregister()));
    }
    if ('caches' in window) {
      const names = await caches.keys();
      await Promise.all(names.map(name => caches.delete(name)));
    }
    status.textContent = 'Old cache removed. Loading the updated app…';
    setTimeout(() => location.replace('./?refresh=' + Date.now()), 700);
  } catch (error) {
    console.error(error);
    status.textContent = 'The automatic refresh did not finish. Tap Try again.';
    retry.hidden = false;
    retry.onclick = () => location.reload();
  }
})();
</script>
</body>
</html>
