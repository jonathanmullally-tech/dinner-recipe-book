<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#8e2d2d">
  <title>Updating Dinner Recipe Book</title>
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#fbf6ef;color:#2d2520;margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}.card{max-width:520px;background:#fff;border:1px solid #ded2c7;border-radius:18px;padding:24px;box-shadow:0 8px 28px rgba(54,36,25,.12)}h1{margin-top:0;color:#8e2d2d}.bar{height:12px;background:#eee4dc;border-radius:999px;overflow:hidden}.bar:after{content:'';display:block;height:100%;width:45%;background:#8e2d2d;border-radius:999px;animation:move 1s infinite alternate}@keyframes move{to{transform:translateX(120%)}}.error{color:#7a1f1f}
  </style>
</head>
<body>
  <div class="card">
    <h1>Updating recipe book…</h1>
    <p id="status">Removing the old cached app files. Your saved recipes, favourites, notes and photos will remain.</p>
    <div class="bar" aria-hidden="true"></div>
  </div>
  <script>
    (async()=>{
      try{
        if('serviceWorker' in navigator){
          const registrations=await navigator.serviceWorker.getRegistrations();
          await Promise.all(registrations.map(registration=>registration.unregister()));
        }
        if('caches' in window){
          const names=await caches.keys();
          await Promise.all(names.map(name=>caches.delete(name)));
        }
        document.getElementById('status').textContent='Update complete. Reopening the recipe book…';
        setTimeout(()=>location.replace('./?updated=10'),700);
      }catch(error){
        document.getElementById('status').innerHTML='<span class="error">The automatic cache reset failed. Close this tab, reopen Chrome and load the main recipe page again.</span>';
      }
    })();
  </script>
</body>
</html>
