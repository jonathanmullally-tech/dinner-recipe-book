name: Build static website recipe library

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - recipes-data.js
      - build_static_recipes.py
      - requirements.txt
      - .github/workflows/build-static-recipes.yml

permissions:
  contents: write

concurrency:
  group: static-recipe-library
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install builder dependencies
        run: python -m pip install --upgrade -r requirements.txt

      - name: Build static recipe data and food photos
        run: python build_static_recipes.py

          - name: Commit generated library
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add website-recipes.js website-assets.js static-build-report.json

          if [ -d "assets/website" ]; then
            git add assets/website
          fi

          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "Build static website recipe library"
            git pull --rebase origin main
            git push origin main
          fi
